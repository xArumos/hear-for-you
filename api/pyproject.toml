[project]
name = "hear-for-you-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "numpy>=2.5.4",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "soundfile>=0.14.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
gemma = [
    "accelerate>=1.15.0",
    "librosa>=1.0.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Experimental local Gemma describe backend (p1/gemma-experiment). Not installed by default:
# `uv sync --group gemma`. CPU-only torch so no CUDA wheels are pulled.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
