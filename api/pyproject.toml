[project]
name = "hearalert-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "numpy>=2.5.4",
    "python-multipart>=0.0.32",
    "soundfile>=0.14.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
